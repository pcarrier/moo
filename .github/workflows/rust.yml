name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: cargo clippy + test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          bun install --cwd shared --frozen-lockfile --no-progress
          bun install --cwd web --frozen-lockfile --no-progress
          bun install --cwd harness --frozen-lockfile --no-progress

      - name: Run Clippy
        run: |
          cargo clippy \
            --workspace \
            --all-targets \
            --all-features \
            --locked \
            --no-deps \
            -- \
            -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: TypeScript typecheck
        run: |
          bun --cwd shared typecheck --pretty false
          bun --cwd web typecheck --pretty false
          bun --cwd web typecheck:test --pretty false
          bun --cwd harness typecheck --pretty false

      - name: Run web tests
        run: bun --cwd web test

      - name: Run harness tests
        run: bun --cwd harness test
