name: Binaries

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            nix-package: moo-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            nix-package: default
          - os: macos-15
            target: aarch64-apple-darwin
            nix-package: default
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        if: runner.os != 'Windows' && !(runner.os == 'macOS' && runner.arch == 'X64')
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Determinate's installer and cache no longer support Intel macOS.
      - name: Install Nix (Intel macOS)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        uses: cachix/install-nix-action@19effe9fe722874e6d46dd7182e4b8b7a43c4a99 # v31.10.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Magic Nix cache
        if: runner.os != 'Windows' && !(runner.os == 'macOS' && runner.arch == 'X64')
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build Unix binary
        if: runner.os != 'Windows'
        run: nix build .#${{ matrix.nix-package }}

      - name: Install Rust toolchain (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun (Windows)
        if: runner.os == 'Windows'
        uses: oven-sh/setup-bun@v2

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          (cd web && bun install --frozen-lockfile)
          bun install --cwd harness --frozen-lockfile --no-progress
          cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="${GITHUB_SHA::12}"
          fi
          stem="moo-${version}-${{ matrix.target }}"
          mkdir -p "dist/${stem}"
          cp result/bin/moo "dist/${stem}/moo"
          chmod +x "dist/${stem}/moo"
          tar -C dist -czf "dist/${stem}.tar.gz" "${stem}"
          shasum -a 256 "dist/${stem}.tar.gz" > "dist/${stem}.tar.gz.sha256"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            $version = $env:GITHUB_SHA.Substring(0, 12)
          }
          $stem = "moo-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stem" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/moo.exe" "dist/$stem/moo.exe"
          Compress-Archive -Path "dist/$stem" -DestinationPath "dist/$stem.zip" -Force
          $hash = Get-FileHash "dist/$stem.zip" -Algorithm SHA256
          "$($hash.Hash.ToLower())  dist/$stem.zip" | Set-Content "dist/$stem.zip.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moo-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
