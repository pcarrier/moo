<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>Moo</title>
    <link
      rel="icon"
      href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐮</text></svg>'
    />
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fafafa; color: #1a1a1a; }
      .boot-loading { position: fixed; inset: 0; display: grid; place-items: center; padding: 2rem; background: #fafafa; }
      .boot-loading-cow { display: inline-grid; place-items: center; width: 8rem; height: 8rem; font-size: 6.5rem; line-height: 1; transform-origin: center; filter: drop-shadow(0 0.75rem 1rem rgba(0, 0, 0, 0.2)); }
      @media (prefers-color-scheme: dark) {
        body, .boot-loading { background: #141414; color: #e8e8e8; }
      }
    </style>
  </head>
  <body>
    <div id="app" class="boot-loading" role="status" aria-label="Loading" aria-busy="true">
      <span class="boot-loading-cow" aria-hidden="true">🐮</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
