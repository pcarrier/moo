[package]
name = "moo"
version = "0.2.11"
edition = "2024"
description = "Local agent harness and UI"
license = "MIT"
repository = "https://github.com/pcarrier/moo"
keywords = ["agent", "cli", "harness"]
categories = ["command-line-utilities"]

[[bin]]
name = "moo"
path = "src/main.rs"

[dependencies]
rusty_v8 = { package = "v8", version = "147.1.0" }
rusqlite = { version = "0.39", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
spargebra = "0.4.6"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
ureq = "3"
getrandom = "0.3"
sha1 = "0.11"
base64 = "0.22"
glob = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
futures-util = "0.3"
brotli = "8"

[build-dependencies]
brotli = "8"

[profile.profiling]
inherits = "release"
debug = true
strip = false
split-debuginfo = "packed"
