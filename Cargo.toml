[package]
name = "moo"
version = "0.11.0"
edition = "2024"
description = "Local agent harness and UI"
license = "MIT"
repository = "https://github.com/pcarrier/moo"
keywords = ["agent", "cli", "harness"]
categories = ["command-line-utilities"]

[[bin]]
name = "moo"
path = "src/main.rs"

[dependencies]
rusty_v8 = { package = "v8", version = "152.2.0" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
spargebra = "0.4.7"
sha2 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
ureq = "3.4.2"
getrandom = "0.4.3"
sha1 = "0.11.0"
base64 = "0.23.1"
argon2 = "0.6.0"
glob = "0.3.4"
libc = "0.2.189"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
futures-util = { version = "0.3.34", features = ["sink"] }
brotli = "9.0.0"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
minisign-verify = "0.2.5"

[build-dependencies]
brotli = "9.0.0"

[profile.profiling]
inherits = "release"
debug = true
strip = false
split-debuginfo = "packed"
