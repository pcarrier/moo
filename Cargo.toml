[package]
name = "moo"
version = "0.6.3"
edition = "2024"
description = "Local agent harness and UI"
license = "MIT"
repository = "https://github.com/pcarrier/moo"
keywords = ["agent", "cli", "harness"]
categories = ["command-line-utilities"]

[[bin]]
name = "moo"
path = "src/main.rs"

[dependencies]
rusty_v8 = { package = "v8", version = "147.1.0" }
rusqlite = { version = "0.39", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
spargebra = "0.4.6"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
ureq = "3"
getrandom = "0.3"
sha1 = "0.11"
base64 = "0.22"
glob = "0.3"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
futures-util = { version = "0.3", features = ["sink"] }
brotli = "8"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[build-dependencies]
brotli = "8"

[profile.profiling]
inherits = "release"
debug = true
strip = false
split-debuginfo = "packed"
