[package]
name = "moo"
version = "0.7.1"
edition = "2024"
description = "Local agent harness and UI"
license = "MIT"
repository = "https://github.com/pcarrier/moo"
keywords = ["agent", "cli", "harness"]
categories = ["command-line-utilities"]

[[bin]]
name = "moo"
path = "src/main.rs"

[dependencies]
rusty_v8 = { package = "v8", version = "150" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
spargebra = "0.4.6"
sha2 = "0.11"
clap = { version = "4", features = ["derive", "env"] }
ureq = "3"
getrandom = "0.4"
sha1 = "0.11"
base64 = "0.22"
argon2 = { version = "0.5", features = ["std"] }
glob = "0.3"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
futures-util = { version = "0.3", features = ["sink"] }
brotli = "8"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
minisign-verify = "0.2.5"

[build-dependencies]
brotli = "8"

[profile.profiling]
inherits = "release"
debug = true
strip = false
split-debuginfo = "packed"
